<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 例 dev 通读结果 · Grounding Verifier</title>
<style nonce="__NONCE__">
:root{--ink:#193249;--muted:#5c7082;--blue:#285e8b;--line:#ccd9e3;--wash:#edf3f8;--green:#276549;--amber:#805b17;--red:#a0303b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font:14px/1.7 "Avenir Next","PingFang SC",sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer;background:white;color:var(--ink)}button,input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:8px 11px}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #7aa6ca;outline-offset:3px}button:disabled{opacity:.5;cursor:default}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.5px;font-weight:600}h2{font-size:19px;font-weight:600}h3{font-size:16px}.top{background:var(--ink);color:white;padding:14px 26px;display:flex;justify-content:space-between;font-size:13px}.top strong{font-size:16px}.intro{padding:25px 26px 20px;max-width:1500px;margin:auto}.intro p{margin-top:8px;color:var(--muted)}.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.counts span{background:white;padding:4px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding:0 26px 40px;max-width:1500px;margin:auto;align-items:start}.side{position:sticky;top:18px}.side h2{font-size:14px;margin:0 0 10px}.case-button{display:block;width:100%;text-align:left;border:0;padding:11px 12px;margin-bottom:5px;background:transparent;line-height:1.55}.case-button span{display:block;font-size:11px;color:var(--muted)}.case-button.active{background:var(--ink);color:white}.case-button.active span{color:#cbddea}.side-note{font-size:12px;color:var(--muted);margin-top:19px;padding-top:14px;border-top:1px solid var(--line)}.main{min-width:0}.toolbar{background:white;padding:12px 14px;border:1px solid var(--line);border-radius:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:160px}.toolbar label{font-size:12px;white-space:nowrap}.toolbar input[type=checkbox]{min-width:0;vertical-align:middle;width:auto;accent-color:var(--blue)}.result-count{font-size:12px;color:var(--muted);margin:10px 1px 16px}.group-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 11px}.group-head button{font-size:12px;padding:6px 9px}.case-subtitle{font-size:12px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:13px;padding:17px 20px}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.id{font-size:12px;color:var(--muted)}.verdict{font-size:12px;border-radius:5px;padding:3px 8px;white-space:nowrap;font-weight:600}.SUPPORTED{background:#e8f3ec;color:var(--green)}.UNSUPPORTED{background:#fff3d6;color:var(--amber)}.CONTRADICTED{background:#fbe9ec;color:var(--red)}.NONE{background:#eaf0f5;color:#455e75}.claim{font-size:17px;line-height:1.7;margin:9px 0 7px}.reason{color:#425b70;font-size:13px}.issues{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.issue{font-size:11px;background:#f3f6f9;border:1px solid #dce5ed;color:#566e81;padding:2px 7px;border-radius:4px}.split{border-left:3px solid #8baec9;padding:2px 0 2px 14px;margin:14px 0 10px}.split>strong{font-size:13px}.split ol{padding-left:19px;margin:8px 0}.split li{margin:9px 0}.split .verdict{font-size:10px;padding:2px 5px;margin-left:7px}.split small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.english{font:16px/1.8 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer;font-size:12px;color:var(--blue)}.proof{margin-top:11px;padding-top:12px;border-top:1px solid #e0e8ef}.proof .english{margin-bottom:12px}.reference{display:grid;grid-template-columns:1.2fr 1fr;gap:17px;background:#f5f8fb;border-radius:7px;padding:12px;margin:9px 0}.reference blockquote{font:14px/1.8 Georgia,serif;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.reference p{font-size:13px;color:#516a7d}.reference small{display:block;font:11px/1.6 "Avenir Next","PingFang SC",sans-serif;color:var(--muted);margin-bottom:6px}.child-english{margin:9px 0 3px;font:15px/1.75 Georgia,serif}.feedback{margin-top:12px;border-top:1px solid #e3eaf0;padding-top:10px}.feedback summary{color:var(--muted)}.feedback-form{display:grid;grid-template-columns:180px 1fr auto;gap:8px;align-items:start;margin-top:10px}.feedback textarea{resize:vertical;min-height:66px;width:100%;font-size:12px}.feedback select{font-size:12px;width:100%}.feedback button{font-size:12px;background:var(--blue);color:white;border-color:var(--blue)}.message{font-size:12px;margin-top:7px;color:var(--green)}.error{color:var(--red)}.approved{border-color:#98b9a7;background:#fbfefc}.approved .reason{margin-top:8px}.approved-title{color:var(--green);font-size:13px;margin:22px 0 10px}.empty{padding:35px;color:var(--muted);text-align:center;background:white;border-radius:10px}dialog{border:1px solid var(--line);border-radius:12px;max-width:min(1100px,94vw);width:1000px;max-height:90vh;padding:0;color:var(--ink)}dialog::backdrop{background:#132c43a8}.dialog-head{position:sticky;top:0;background:white;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.dialog-body{padding:18px 22px}.dialog-body h3{margin:20px 0 10px}.dialog-body pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.85 Georgia,serif;background:#f5f8fb;padding:14px;border-radius:7px}.dialog-body .labels{font:12px/1.7 monospace}.upstream{font-size:11px;color:var(--muted);margin-top:10px}.parent-note{font-size:12px;color:var(--muted);margin-bottom:10px}@media(max-width:1000px){.layout{grid-template-columns:190px minmax(0,1fr);gap:14px;padding:0 16px 30px}.intro{padding:20px 16px}.feedback-form{grid-template-columns:1fr}.reference{grid-template-columns:1fr}.card{padding:15px 16px}}@media(max-width:700px){.top{padding:12px 16px}.top span{display:none}.layout{display:block}.side{position:static;margin-bottom:14px}.case-list{display:flex;gap:5px;overflow:auto}.case-button{min-width:145px;margin-bottom:0}.side-note{display:none}.toolbar input{width:100%}h1{font-size:24px}.claim{font-size:16px}.group-head{align-items:start}.counts{gap:5px}}
</style></head><body>
<header class="top"><strong>Grounding Verifier / 通读结果</strong><span>英文原文核对 · 中文解释 · 逐条复核</span></header>
<section class="intro"><h1>剩余主张，我已逐条看过</h1><p>当前 5 例 dev 的助手通读建议。原英文、判断理由与拆分方案均可展开核对；这不是独立盲审，待审建议尚未写入金标。</p><div class="counts" id="counts"></div></section>
<main class="layout"><aside class="side"><h2>按案例查看</h2><nav class="case-list" id="case-list"></nav><p class="side-note">你已确认的 9775-c19 三个拆分项单独保留为人工结果。<br><br>其余内容可以逐条留下“无异议 / 需要修改 / 拿不准”的核对意见。每次保存只记录当前一条，不直接合并金标。</p></aside><section class="main"><div class="toolbar"><input id="search" type="search" aria-label="搜索编号或中英文内容" placeholder="搜索编号或关键词"><select id="verdict-filter" aria-label="按建议标签筛选"><option value="all">所有建议标签</option><option value="SUPPORTED">建议 S · 有依据</option><option value="CONTRADICTED">建议 C · 与来源矛盾</option><option value="UNSUPPORTED">建议 U · 未支持</option><option value="NONE">建议不单独计分</option></select><label><input id="attention" type="checkbox">优先看需核对项</label></div><p class="result-count" id="result-count"></p><div id="results"></div></section></main>
<dialog id="source-dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭完整材料">关闭</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<script nonce="__NONCE__">
const DATA=__PAYLOAD__,TOKEN=document.currentScript.nonce,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={'ragtruth-13105':'条形图制作','ragtruth-15677':'油性皮肤的致因','ragtruth-2426':'克林顿基金会报道','ragtruth-66':'兰德·保罗评论','ragtruth-9775':"Peabody's 顾客评论"};
const labels={SUPPORTED:'S · 有依据',CONTRADICTED:'C · 与来源矛盾',UNSUPPORTED:'U · 未支持',NONE:'不单独计分'};
const outcomes={agree:'看过，无异议',change:'需要修改',uncertain:'暂时拿不准'};
let selectedCase='all';
function badge(verdict,prefix='建议 '){const key=verdict||'NONE';return `<span class="verdict ${key}">${prefix}${labels[key]}</span>`;}
function references(entry){const list=[...(entry.evidence_candidates||[]),...(entry.related_context||[])];return list.map(e=>`<div class="reference"><div><small>上下文 ${e.index} [${e.start_char}, ${e.end_char}) · 精确子串</small><blockquote>${esc(e.quote)}</blockquote></div><div><small>中文释义</small><p>${esc(e.zh)}</p></div></div>`).join('');}
function originals(caseId){const c=DATA.cases.find(c=>c.id===caseId);$('dialog-title').textContent=`${caseId} · 完整英文材料`;$('dialog-body').innerHTML=`<p class="parent-note">英文回答及上下文保持现有数据原文。来源字段与上游标注供你核查，不自动决定标签。</p><h3>完整回答</h3><pre>${esc(c.generated_answer)}</pre>${c.context_passages.map((p,i)=>`<h3>上下文 ${i}</h3><pre>${esc(p)}</pre>`).join('')}<details><summary>上游标注原记录</summary><pre class="labels">${esc(JSON.stringify(c.source_labels,null,2))}</pre></details>`;$('source-dialog').showModal();}
function draftKey(id){return `pilot-review:${DATA.source_sha256}:${id}`;}
function card(r){let saved=DATA.feedback[r.review_id],draft=saved||{};try{const local=localStorage.getItem(draftKey(r.review_id));if(local)draft=JSON.parse(local);}catch(e){}const article=document.createElement('article');article.className='card';article.dataset.claimId=r.claim_id;article.innerHTML=`<div class="card-head"><span class="id">${esc(r.claim_id)}</span>${badge(r.suggested_verdict)}</div><h3 class="claim">${esc(r.claim_zh)}</h3><p class="reason">${esc(r.reason_zh)}</p>${r.issues.length?`<div class="issues">${r.issues.map(i=>`<span class="issue">${esc(i)}</span>`).join('')}</div>`:''}${r.proposed_children.length?`<section class="split"><strong>建议拆成 ${r.proposed_children.length} 条，保留原限定</strong><ol>${r.proposed_children.map(ch=>`<li>${esc(ch.claim_zh)} ${badge(ch.suggested_verdict,'')}<small>${esc(ch.reason_zh)}</small></li>`).join('')}</ol></section>`:''}<details><summary>核对英文主张、原文依据与中文释义</summary><div class="proof"><p class="english">${esc(r.claim_text)}</p>${references(r)}${r.proposed_children.map(ch=>`<p class="child-english">${esc(ch.claim_text)}</p>${references(ch)}`).join('')}${r.upstream_verdict?`<p class="upstream">原稿中的上游映射：${esc(labels[r.upstream_verdict])}。助手建议与上游独立列出，等待人工复核。</p>`:''}</div></details><details class="feedback"><summary>${saved?'已记录：'+esc(outcomes[saved.outcome]):'记录这一条的核对意见'}</summary><div class="feedback-form"><select aria-label="${esc(r.claim_id)} 的核对意见"><option value="">请选择你的意见</option>${Object.entries(outcomes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><textarea aria-label="${esc(r.claim_id)} 的中文修改说明" placeholder="需要修改时，请用中文指出标签、拆分或理由哪里不对。无异议可留空。"></textarea><button type="button">保存这一条</button></div><p class="message" aria-live="polite"></p></details>`;const select=article.querySelector('select'),text=article.querySelector('textarea'),button=article.querySelector('.feedback button'),message=article.querySelector('.message');select.value=draft.outcome||'';text.value=draft.comment_zh||'';const cache=()=>{try{localStorage.setItem(draftKey(r.review_id),JSON.stringify({outcome:select.value,comment_zh:text.value}));}catch(e){}};select.onchange=cache;text.oninput=cache;button.onclick=async()=>{if(!select.value){message.textContent='请选择你对这一条的意见。';message.className='message error';return;}button.disabled=true;try{const response=await fetch('/api/pilot-review-feedback',{method:'POST',headers:{'Content-Type':'application/json','X-Form-Token':TOKEN},body:JSON.stringify({review_id:r.review_id,source_sha256:DATA.source_sha256,outcome:select.value,comment_zh:text.value})});const result=await response.json();if(!response.ok)throw Error(typeof result.detail==='string'?result.detail:'保存失败，请检查内容。');DATA.feedback[r.review_id]={outcome:select.value,comment_zh:text.value};article.querySelector('.feedback summary').textContent='已记录：'+outcomes[select.value];message.textContent='这条核对意见已追加保存，金标尚未变更。';message.className='message';cache();}catch(e){message.textContent=e.message;message.className='message error';}finally{button.disabled=false;}};return article;}
function render(){const query=$('search').value.trim().toLowerCase(),filter=$('verdict-filter').value,attention=$('attention').checked;const reviews=DATA.reviews.filter(r=>(selectedCase==='all'||r.case_id===selectedCase)&&(filter==='all'||(r.suggested_verdict||'NONE')===filter)&&(!attention||r.issues.length||r.suggested_verdict!=='SUPPORTED')&&(!query||JSON.stringify([r.claim_id,r.claim_text,r.claim_zh,r.reason_zh,r.proposed_children]).toLowerCase().includes(query)));$('result-count').textContent=`显示 ${reviews.length} / ${DATA.reviews.length} 条待审建议；人工已确认项在所属案例下单独保留。`;$('results').textContent='';for(const c of DATA.cases){const rows=reviews.filter(r=>r.case_id===c.id),confirmed=DATA.confirmed.filter(d=>d.case_id===c.id&&(selectedCase==='all'||selectedCase===c.id));if(!rows.length&&!confirmed.length)continue;const group=document.createElement('section');const head=document.createElement('div');head.className='group-head';head.innerHTML=`<div><h2>${esc(names[c.id]||c.id)}</h2><span class="case-subtitle">${esc(c.id)} · ${rows.length} 条建议</span></div><button type="button">查看本例完整英文材料</button>`;head.querySelector('button').onclick=()=>originals(c.id);group.append(head);rows.forEach(r=>group.append(card(r)));if(confirmed.length){const title=document.createElement('p');title.className='approved-title';title.textContent=`你已确认的人工结果 · ${confirmed.length} 条`;group.append(title);confirmed.forEach(d=>{const row=document.createElement('article');row.className='card approved';row.dataset.confirmed='true';row.innerHTML=`<div class="card-head"><span class="id">${esc(d.claim_id)}</span>${badge(d.verdict,'人工已确认 ')}</div><h3 class="claim">${esc(d.claim_zh||d.claim_text)}</h3><p class="english">${esc(d.claim_text)}</p><p class="reason">${esc(d.note)}</p>`;group.append(row);});}$('results').append(group);}if(!$('results').children.length)$('results').innerHTML='<p class="empty">没有符合条件的主张。请清除搜索或切回全部。</p>';}
function caseButton(id,title,meta){const button=document.createElement('button');button.className='case-button'+(id==='all'?' active':'');button.innerHTML=`${esc(title)}<span>${esc(meta)}</span>`;button.onclick=()=>{selectedCase=id;[...$('case-list').children].forEach(b=>b.classList.toggle('active',b===button));render();};$('case-list').append(button);}
const counts={SUPPORTED:0,CONTRADICTED:0,UNSUPPORTED:0,NONE:0};DATA.reviews.forEach(r=>counts[r.suggested_verdict||'NONE']++);$('counts').innerHTML=`<span>${DATA.cases.length} 例 dev</span><span>${DATA.reviews.length} 条待审建议</span><span>建议 S ${counts.SUPPORTED} / U ${counts.UNSUPPORTED} / C ${counts.CONTRADICTED}</span><span>${counts.NONE} 条建议不单列</span><span>${DATA.reviews.filter(r=>r.proposed_children.length).length} 条附拆分方案</span><span>${DATA.confirmed.length} 条人工已确认</span>`;
caseButton('all','全部案例',`${DATA.reviews.length} 条待审建议`);DATA.cases.forEach(c=>caseButton(c.id,names[c.id]||c.id,`${c.id} · ${DATA.reviews.filter(r=>r.case_id===c.id).length} 条`));$('search').oninput=render;$('verdict-filter').onchange=render;$('attention').onchange=render;$('close-dialog').onclick=()=>$('source-dialog').close();render();
</script></body></html>
