[project]
name = "grounding-verifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "anthropic>=0.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
